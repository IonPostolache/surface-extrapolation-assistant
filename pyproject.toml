[project]
name = "offlinedraw2cad"
version = "0.1.0"
description = "A free, fully local tool that reconstructs 2D engineering drawings into provisional, editable parametric CAD models, flagging every assumption it had to make."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Ion" }
]
keywords = ["cad", "engineering-drawing", "vlm", "build123d", "step", "local-ai"]

dependencies = [
    "build123d>=0.10.0",
    "pydantic>=2.6",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "openai>=1.30",
    "cairosvg>=2.7",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
benchmark-setup = [
    "h5py>=3.10",
]

[project.scripts]
offlinedraw2cad = "offlinedraw2cad.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offlinedraw2cad"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"