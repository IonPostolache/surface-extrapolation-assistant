[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surface-extrapolation-assistant"
version = "0.1.0"
description = "Automated boundary-face extension for FreeCAD with a local vision-LLM diagnostic layer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ion Postolache" }
]
keywords = ["freecad", "cad", "surface", "extrapolation", "stamping", "llm", "lmstudio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering :: CAD",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Runtime dependencies
# NOTE: FreeCAD is NOT a pip-installable package. It must be installed separately
# (system-wide) and its library path added to sys.path at runtime.
dependencies = [
    "requests>=2.31",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
    "pillow>=10.0",  
]

[project.urls]
Homepage = "https://github.com/IonPostolache/surface-extrapolation-assistant"
Repository = "https://github.com/IonPostolache/surface-extrapolation-assistant"
Issues = "https://github.com/IonPostolache/surface-extrapolation-assistant/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "black>=24.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.scripts]
surface-assistant = "surface_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=surface_assistant --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true