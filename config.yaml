# Surface Extrapolation Assistant configuration

freecad:
  # Path to FreeCAD's bin/ or lib/ directory.
  # Examples:
  #   Windows: "C:\\Program Files\\FreeCAD 1.0\\bin"
  #   Linux:   "/usr/lib/freecad/lib"
  #   macOS:   "/Applications/FreeCAD.app/Contents/Resources/lib"
  # lib_path: "/usr/lib/freecad/lib"   # <-- set this to your FreeCAD install
  lib_path: "/home/gion/.FreeCAD/squashfs-root/usr/lib"


extrapolation:
  target_distance_mm: 10.0     # default 100
  tolerance_percent: 10.0       # acceptable deviation on target distance
  max_correction_passes: 1      # calibration correction attempts
  initial_ratio: 1.0            # starting UV extension ratio

join:
  sewing_tolerance_mm: 0.04     # your join tolerance, default 0.04
  refine_shape: true

llm:
  enabled: true
  provider: "lmstudio"
  endpoint: "http://localhost:1234/v1"
  model: "qwen3-vl-30b-a3b-instruct"  # for our usecase, we use the instruction-tuned model
  # model: "qwen3-vl-30b-a3b-thinking"
  timeout_seconds: 120
  temperature: 0.2

logging:
  level: "INFO"
  log_dir: "logs"